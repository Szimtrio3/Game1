name: Build Scratch SB3

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Scratch project
        run: python3 build_game.py

      - name: Upload SB3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: chrono-rift-sb3
          path: chrono-rift.sb3
          if-no-files-found: error
